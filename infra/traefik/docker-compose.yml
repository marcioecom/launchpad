services:
  traefik:
    image: traefik:v3.2
    container_name: traefik
    restart: unless-stopped
    environment:
      # Força versão da API do Docker. Docker Engine 25+ requer API >= 1.40,
      # e o Go SDK do Traefik às vezes faz fallback para 1.24 quando a
      # negociação automática falha, causando erro de "client too old".
      - DOCKER_API_VERSION=1.43
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./certs:/etc/traefik/certs:ro
    networks:
      - web
    labels:
      - traefik.enable=true
      # Dashboard só acessível via Tailscale (porta interna)
      - traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.tls=true

networks:
  web:
    name: web
    external: true
